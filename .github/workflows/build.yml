name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make pkg-config libsdl2-dev libfreetype6-dev
      - name: Build both frontends and test
        run: make -j2 all test
      - name: Validate launchers
        run: sh -n play.sh ghostty-play.sh
      - name: Package verified Linux binaries and source
        run: python3 tools/package_release.py "$RUNNER_TEMP/terminal-velocity-release"
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-velocity-linux-x64
          path: ${{ runner.temp }}/terminal-velocity-release/*
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
      - name: Build native Windows terminal and tests
        shell: msys2 {0}
        run: make -j2 windows windows-tests MINGW_CXX=g++ MINGW_WINDRES=windres
      - name: Run native Windows tests
        shell: msys2 {0}
        run: |
          ./physics_tests.exe
          ./extension_tests.exe
          ./multiplayer_tests.exe
          ./campaign_tests.exe
          TV_TEST_CONSOLE=1 ./windows_input_tests.exe
          ./terminal_velocity.exe --smoke
  windows-package:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-build dependencies
        run: sudo apt-get update && sudo apt-get install -y make g++-mingw-w64-x86-64
      - name: Build Windows terminal and window launchers
        run: MAKEFLAGS=-j2 sh tools/build_windows_sdl.sh
      - name: Package both Windows frontends
        run: python3 tools/package_release.py "$RUNNER_TEMP/terminal-velocity-release" --windows-only
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-velocity-windows-x64
          path: ${{ runner.temp }}/terminal-velocity-release/terminal-velocity-windows-x64.zip
          if-no-files-found: error
